name: Build Qwen 3.8 llama.cpp image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.qwen38
      - .github/workflows/build-qwen38.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: phikapjames/qwen38-llama
  IMAGE_TAG: 23b0202-visionfix

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qwen38
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Qwen 3.8 Flash-Next upstream llama.cpp runtime for AMD Strix Halo Vulkan
          cache-from: type=gha
          cache-to: type=gha,mode=max
