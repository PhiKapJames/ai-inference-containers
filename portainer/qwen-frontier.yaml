services:
  qwen-frontier:
    image: ghcr.io/phikapjames/qwen38-llama@sha256:d0975bfe47c47a157e2590ed40ec211b815b85bc2e3068f08d5fa477ea6371a4
    pull_policy: always
    container_name: qwen-frontier
    restart: unless-stopped

    devices:
      - /dev/dri:/dev/dri

    security_opt:
      - seccomp=unconfined

    environment:
      AMD_VULKAN_ICD: RADV
      VK_LOADER_DEBUG: error

    volumes:
      - /srv/ai/models/qwen3.8-flash-next-unsloth-iq4xs-v31:/models:ro
      - /srv/ai/models/qwen3.8-flash-next/mmproj-BF16.gguf:/vision/mmproj-BF16.gguf:ro
      - /srv/ai/models/qwen3.8-flash-next/mtp-Qwen3.8-Flash-Next-Q4_0.gguf:/draft/mtp-Qwen3.8-Flash-Next-Q4_0.gguf:ro
      - /srv/ai/secrets/qwen-general-api-key:/run/secrets/qwen_api_key:ro

    ports:
      - "8082:8080"

    stop_grace_period: 60s

    command:
      - --metrics
      - -m
      - /models/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00004.gguf
      # Two 262144-token slots share the context pool.
      # Q8 K/V controls cache memory while retaining the per-request window.
      - --mmproj
      - /vision/mmproj-BF16.gguf
      - -md
      - /draft/mtp-Qwen3.8-Flash-Next-Q4_0.gguf
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
      - --spec-draft-p-min
      - "0.0"
      - -ngl
      - "999"
      - -fa
      - "on"
      - -ub
      - "512"
      - -b
      - "2048"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - -c
      - "524288"
      - -np
      - "2"
      - -lm
      - dio
      - --jinja
      - --reasoning-preserve
      - --cache-ram
      - "8192"
      - --ctx-checkpoints
      - "32"
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --alias
      - qwen3.8-flash-next-frontier
      - --api-key-file
      - /run/secrets/qwen_api_key
